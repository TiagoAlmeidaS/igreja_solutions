<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden max-w-md mx-auto shadow-xl">
<div class="flex items-center p-4 pb-2 justify-between">
<button class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Novo Convidado</h2>
</div>
<div class="px-4 pt-4 pb-2">
<div class="flex items-center gap-3 mb-6 bg-primary/10 p-4 rounded-xl">
<div class="bg-primary text-white p-2 rounded-lg">
<span class="material-symbols-outlined">person_add</span>
</div>
<div>
<h3 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight">Boas-vindas!</h3>
<p class="text-slate-500 dark:text-slate-400 text-sm">Registre um novo amigo hoje.</p>
</div>
</div>
</div>
<div class="flex flex-col gap-4 px-4 pb-8">
<h3 class="text-slate-900 dark:text-slate-100 text-sm font-semibold uppercase tracking-wider">Informações Pessoais</h3>
<label class="flex flex-col">
<p class="text-slate-700 dark:text-slate-300 text-sm font-medium pb-1.5 ml-1">Nome Completo</p>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">person</span>
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-1 focus:ring-primary h-12 pl-10 pr-4 placeholder:text-slate-400" placeholder="Ex: João Silva" value=""/>
</div>
</label>
<label class="flex flex-col">
<p class="text-slate-700 dark:text-slate-300 text-sm font-medium pb-1.5 ml-1">WhatsApp</p>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">chat</span>
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-1 focus:ring-primary h-12 pl-10 pr-4 placeholder:text-slate-400" placeholder="(00) 00000-0000" type="tel" value=""/>
</div>
</label>
<div class="grid grid-cols-2 gap-4">
<label class="flex flex-col">
<p class="text-slate-700 dark:text-slate-300 text-sm font-medium pb-1.5 ml-1">Bairro</p>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">location_on</span>
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-1 focus:ring-primary h-12 pl-10 pr-4 placeholder:text-slate-400" placeholder="Onde mora?" value=""/>
</div>
</label>
<label class="flex flex-col">
<p class="text-slate-700 dark:text-slate-300 text-sm font-medium pb-1.5 ml-1">Cidade</p>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">location_city</span>
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-1 focus:ring-primary h-12 pl-10 pr-4 placeholder:text-slate-400" placeholder="Sua cidade" value=""/>
</div>
</label>
</div>
<label class="flex flex-col">
<p class="text-slate-700 dark:text-slate-300 text-sm font-medium pb-1.5 ml-1">Quem Convidou?</p>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">group</span>
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-1 focus:ring-primary h-12 pl-10 pr-4 placeholder:text-slate-400" placeholder="Nome" value=""/>
</div>
</label>
<div class="flex flex-col gap-2 mt-4">
<p class="text-slate-700 dark:text-slate-300 text-sm font-medium ml-1">Interesse / Engajamento</p>
<div class="grid grid-cols-3 gap-2 bg-slate-200/50 dark:bg-slate-800 p-1 rounded-xl">
<button class="flex flex-col items-center justify-center py-2 rounded-lg bg-white dark:bg-slate-700 shadow-sm border-2 border-transparent">
<span class="material-symbols-outlined text-blue-500">ac_unit</span>
<span class="text-xs font-bold text-slate-600 dark:text-slate-300">Frio</span>
</button>
<button class="flex flex-col items-center justify-center py-2 rounded-lg border-2 border-transparent">
<span class="material-symbols-outlined text-orange-400">wb_sunny</span>
<span class="text-xs font-bold text-slate-600 dark:text-slate-300">Morno</span>
</button>
<button class="flex flex-col items-center justify-center py-2 rounded-lg border-2 border-transparent">
<span class="material-symbols-outlined text-red-500">local_fire_department</span>
<span class="text-xs font-bold text-slate-600 dark:text-slate-300">Quente</span>
</button>
</div>
</div>
<label class="flex flex-col mt-2">
<p class="text-slate-700 dark:text-slate-300 text-sm font-medium pb-1.5 ml-1">Observações Iniciais</p>
<textarea class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-1 focus:ring-primary p-4 placeholder:text-slate-400 resize-none" placeholder="Conte-nos um pouco sobre a primeira conversa..." rows="3"></textarea>
</label>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/30 flex items-center justify-center gap-2 mt-4 transition-all active:scale-95">
<span class="material-symbols-outlined">how_to_reg</span>
                Cadastrar e Iniciar Jornada
            </button>
</div>
<div class="mt-auto p-4 text-center">
<p class="text-slate-400 dark:text-slate-500 text-[10px] uppercase tracking-widest font-bold">Sistema de Acolhimento • Dashboard Meu Serviço</p>
</div>
</div>
</body></html>
