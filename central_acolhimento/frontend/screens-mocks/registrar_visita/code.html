<!DOCTYPE html>

<html class="light" lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2563eb",
                        "background-light": "#f8fafd",
                        "background-dark": "#0f172a",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>Registrar Visita</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto shadow-sm bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- TopAppBar -->
<header class="sticky top-0 z-10 flex items-center bg-white dark:bg-slate-900 px-4 py-4 border-b border-slate-200 dark:border-slate-800">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-700 dark:text-slate-300">arrow_back</span>
</button>
<h2 class="ml-4 text-xl font-bold leading-tight tracking-tight text-slate-900 dark:text-white">Registrar Visita</h2>
</header>
<main class="flex flex-col p-4 space-y-6">
<!-- Search/Selection Section -->
<section class="space-y-2">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-400 px-1">Pessoa Visitada</label>
<div class="flex w-full items-stretch rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus-within:ring-2 focus-within:ring-primary/50 transition-all shadow-sm">
<div class="flex items-center justify-center pl-4 text-slate-400">
<span class="material-symbols-outlined">search</span>
</div>
<input class="w-full border-none bg-transparent py-3 px-3 text-base text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-0" placeholder="Pesquisar pessoa ou grupo" type="text"/>
</div>
</section>
<!-- Metabolismo da Alma Section (Report) -->
<section class="space-y-2">
<h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 px-1">Metabolismo da Alma</h3>
<div class="rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-1 shadow-sm focus-within:border-primary/50">
<textarea class="w-full min-h-[160px] resize-none border-none bg-transparent p-3 text-base leading-relaxed text-slate-700 dark:text-slate-200 placeholder:text-slate-400 focus:ring-0" placeholder="Relate como foi a conversa, o que sentiu e os pontos principais abordados..."></textarea>
</div>
</section>
<!-- Estado Espiritual Mood Tracker -->
<section class="space-y-3">
<h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 px-1">Estado Espiritual</h3>
<div class="grid grid-cols-3 gap-3">
<button class="flex flex-col items-center justify-center p-4 rounded-xl border-2 border-primary/10 bg-white dark:bg-slate-800 hover:border-primary transition-all group">
<span class="text-3xl mb-2">🌱</span>
<span class="text-sm font-medium text-slate-600 dark:text-slate-300 group-hover:text-primary">Novo</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-xl border-2 border-primary bg-primary/5 dark:bg-primary/10 transition-all">
<span class="text-3xl mb-2">🌿</span>
<span class="text-sm font-bold text-primary">Crescendo</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-xl border-2 border-primary/10 bg-white dark:bg-slate-800 hover:border-primary transition-all group">
<span class="text-3xl mb-2">🌳</span>
<span class="text-sm font-medium text-slate-600 dark:text-slate-300 group-hover:text-primary">Firme</span>
</button>
</div>
</section>
<!-- Urgent Help Toggle -->
<section class="flex items-center justify-between p-4 bg-red-50 dark:bg-red-900/20 rounded-xl border border-red-100 dark:border-red-900/30">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-red-600 dark:text-red-400">warning</span>
<span class="font-semibold text-red-700 dark:text-red-300">Precisa de Ajuda Urgente?</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-600"></div>
</label>
</section>
<!-- Spacer -->
<div class="h-8"></div>
</main>
<!-- Fixed Footer Action -->
<footer class="mt-auto p-4 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800">
<button class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary/90 text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
<span class="material-symbols-outlined">send</span>
                Finalizar e Notificar Central
            </button>
</footer>
</div>
</body></html>
